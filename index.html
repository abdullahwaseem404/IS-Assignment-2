<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CipherLab — Web-Based Text Encryption Tool</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --panel-2: #1e2338;
    --border: #2b3252;
    --text: #e6e9f5;
    --muted: #98a0c0;
    --accent: #6c8cff;
    --accent-2: #4f6ef7;
    --success: #35d07f;
    --error: #ff6b6b;
    --warn: #ffc857;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #1b2145 0%, var(--bg) 55%);
    color: var(--text);
    padding: 28px 16px 48px;
  }

  .app { max-width: 1080px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    margin: 0 0 6px;
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #8fa8ff, #6c8cff, #b48cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .banner {
    margin: 0 auto 18px;
    max-width: 1080px;
    padding: 12px 16px;
    border-radius: var(--radius);
    background: rgba(255, 200, 87, 0.12);
    border: 1px solid rgba(255, 200, 87, 0.35);
    color: var(--warn);
    font-size: 0.9rem;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.3px;
  }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.78rem; }

  textarea, select, input[type="text"], input[type="number"], input[type="password"] {
    width: 100%;
    background: #10142a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea {
    min-height: 190px;
    resize: vertical;
    font-family: "Consolas", "SFMono-Regular", Menlo, monospace;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  textarea:focus, select:focus, input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.18);
  }
  #outputText { color: #9be7c4; }

  .row { display: flex; flex-direction: column; gap: 6px; }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 2px;
  }

  button {
    flex: 1 1 auto;
    min-width: 110px;
    padding: 11px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #232a47;
    color: var(--text);
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled) { background: #2b3459; border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
  }
  button.primary:hover:not(:disabled) { background: linear-gradient(135deg, #7d99ff, #5b7bff); }

  button.ghost { background: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { color: var(--text); }

  .status {
    min-height: 22px;
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--muted);
    word-break: break-word;
  }
  .status.success { color: var(--success); }
  .status.error   { color: var(--error); }
  .status.info    { color: var(--accent); }
  .status.warn    { color: var(--warn); }

  footer {
    text-align: center;
    margin-top: 26px;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.6;
  }
  code {
    background: #10142a;
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>🔐 CipherLab</h1>
    <p class="subtitle">Web-Based Text Encryption Tool &nbsp;•&nbsp; Caesar · Base64 · AES-256-GCM · RSA-OAEP · SHA-256</p>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="grid">
    <!-- ============ INPUT PANEL ============ -->
    <section class="panel">
      <div class="row">
        <label for="inputText">
          Input text
          <span class="hint">— plaintext to encrypt, or ciphertext to decrypt</span>
        </label>
        <textarea id="inputText" placeholder="Type or paste your text here…" spellcheck="false"></textarea>
      </div>

      <div class="row">
        <label for="algorithm">Encryption method</label>
        <select id="algorithm">
          <option value="">-- Select a method --</option>
          <option value="caesar">Caesar Cipher</option>
          <option value="base64">Base64 Encoding</option>
          <option value="aes">AES-256-GCM (password-based)</option>
          <option value="rsa">RSA-OAEP 2048-bit (hybrid)</option>
          <option value="sha256">SHA-256 Hash (one-way)</option>
        </select>
      </div>

      <div class="row" id="keyRow" hidden>
        <label for="keyInput" id="keyLabel">Key</label>
        <input id="keyInput" type="text" autocomplete="off" spellcheck="false" />
        <p class="hint" id="keyHint"></p>
      </div>

      <div class="buttons">
        <button id="encryptBtn" class="primary">Encrypt</button>
        <button id="decryptBtn">Decrypt</button>
        <button id="copyBtn">Copy</button>
        <button id="clearBtn" class="ghost">Clear</button>
      </div>
    </section>

    <!-- ============ OUTPUT PANEL ============ -->
    <section class="panel">
      <div class="row">
        <label for="outputText">
          Output
          <span class="hint">— ciphertext / hash</span>
        </label>
        <textarea id="outputText" readonly placeholder="Result appears here…" spellcheck="false"></textarea>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    Everything runs locally in your browser — no text is ever sent to a server.<br />
    Built with the native <code>Web Crypto API</code> (no external libraries).
  </footer>
</div>

<script>
/* =========================================================================
   CipherLab — Web-Based Text Encryption Tool
   -------------------------------------------------------------------------
   All cryptography is performed client-side using the browser's native
   Web Crypto API (window.crypto.subtle) plus two hand-written classical
   ciphers (Caesar) and Base64 encoding.
   ========================================================================= */

(() => {
  "use strict";

  /* ----------------------------- DOM refs ----------------------------- */
  const els = {
    input:      document.getElementById("inputText"),
    output:     document.getElementById("outputText"),
    algo:       document.getElementById("algorithm"),
    keyRow:     document.getElementById("keyRow"),
    keyLabel:   document.getElementById("keyLabel"),
    keyInput:   document.getElementById("keyInput"),
    keyHint:    document.getElementById("keyHint"),
    encryptBtn: document.getElementById("encryptBtn"),
    decryptBtn: document.getElementById("decryptBtn"),
    copyBtn:    document.getElementById("copyBtn"),
    clearBtn:   document.getElementById("clearBtn"),
    status:     document.getElementById("status"),
    banner:     document.getElementById("banner")
  };

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();

  /* ------------------------ Environment check ------------------------- */
  if (!window.crypto || !window.crypto.subtle) {
    els.banner.hidden = false;
    els.banner.textContent =
      "⚠️ Web Crypto API unavailable. AES, RSA and SHA-256 require a secure context " +
      "(https://, http://localhost, or a modern browser). Caesar and Base64 still work.";
  }

  /* --------------------------- Utilities ------------------------------ */
  function setStatus(message, type = "") {
    els.status.textContent = message;
    els.status.className = "status" + (type ? " " + type : "");
  }

  function setBusy(busy) {
    els.encryptBtn.disabled = busy;
    els.decryptBtn.disabled = busy;
    els.copyBtn.disabled = busy;
    els.encryptBtn.textContent = busy ? "Working…" : "Encrypt";
  }

  /* --- Bytes <-> Base64 (UTF-8 safe, chunked to avoid call-stack limits) --- */
  function bytesToBase64(bytes) {
    let binary = "";
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(binary);
  }

  function base64ToBytes(b64) {
    const binary = atob(b64);
    const out = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
    return out;
  }

  const encodeBase64  = (str) => bytesToBase64(encoder.encode(str));
  const decodeBase64  = (b64) => decoder.decode(base64ToBytes(b64));

  /* ======================================================================
     1) CAESAR CIPHER
     ----------------------------------------------------------------------
     Each alphabetic character is shifted `k` positions along the alphabet.
       E(x) = (x + k) mod 26
       D(x) = (x - k) mod 26
     Case is preserved; non-alphabetic characters are left untouched.
     ====================================================================== */
  function caesarCipher(text, shift) {
    const k = ((shift % 26) + 26) % 26;      // normalise to 0..25
    if (k === 0) return text;
    return text.replace(/[a-zA-Z]/g, (ch) => {
      const base = ch <= "Z" ? 65 : 97;      // 'A' = 65, 'a' = 97
      return String.fromCharCode(((ch.charCodeAt(0) - base + k) % 26) + base);
    });
  }

  /* ======================================================================
     2) BASE64
     ----------------------------------------------------------------------
     A reversible binary-to-text encoding (NOT encryption). It maps every
     3 bytes into 4 printable ASCII characters using a 64-character alphabet.
     ====================================================================== */
  function base64Encode(text) {
    return encodeBase64(text);
  }

  function base64Decode(cipher) {
    const cleaned = cipher.replace(/\s+/g, "");
    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(cleaned)) {
      throw new Error("Invalid Base64 input — contains illegal characters.");
    }
    try {
      return decodeBase64(cleaned);
    } catch {
      throw new Error("Invalid Base64 input — could not be decoded.");
    }
  }

  /* ======================================================================
     3) AES-256-GCM  (password based, PBKDF2 key derivation)
     ----------------------------------------------------------------------
     - A random 16-byte salt and 12-byte IV are generated for every message.
     - PBKDF2-HMAC-SHA256 with 150 000 iterations derives a 256-bit key.
     - AES-GCM provides confidentiality AND integrity (auth tag).
     Output format:  AESGCM:<base64 salt>:<base64 iv>:<base64 ciphertext+tag>
     ====================================================================== */
  const PBKDF2_ITERATIONS = 150000;

  async function deriveAesKey(password, salt) {
    const baseKey = await crypto.subtle.importKey(
      "raw",
      encoder.encode(password),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function aesEncrypt(plaintext, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await deriveAesKey(password, salt);

    const cipherBuf = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv },
      key,
      encoder.encode(plaintext)
    );

    return [
      "AESGCM",
      bytesToBase64(salt),
      bytesToBase64(iv),
      bytesToBase64(new Uint8Array(cipherBuf))
    ].join(":");
  }

  async function aesDecrypt(ciphertext, password) {
    const parts = ciphertext.trim().split(":");
    if (parts.length !== 4 || parts[0] !== "AESGCM") {
      throw new Error(
        'Invalid AES ciphertext. Expected format "AESGCM:salt:iv:data".'
      );
    }
    const salt = base64ToBytes(parts[1]);
    const iv   = base64ToBytes(parts[2]);
    const data = base64ToBytes(parts[3]);
    const key  = await deriveAesKey(password, salt);

    try {
      const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return decoder.decode(plainBuf);
    } catch {
      throw new Error("AES decryption failed — wrong password or corrupted ciphertext.");
    }
  }

  /* ======================================================================
     4) RSA-OAEP 2048-bit  (HYBRID encryption)
     ----------------------------------------------------------------------
     RSA-OAEP can only encrypt small payloads (< ~190 bytes for 2048-bit).
     To encrypt arbitrary text we use the standard hybrid scheme:
       1. Generate a random 256-bit AES-GCM key.
       2. Encrypt the message with AES-GCM.
       3. Encrypt ("wrap") the AES key with the RSA public key (OAEP/SHA-256).
     Output format:  RSAOAEP:<base64 wrappedKey>:<base64 iv>:<base64 data>
     Decryption requires the RSA private key held in memory for this session.
     ====================================================================== */
  let rsaKeyPair = null;

  async function getRsaKeyPair() {
    if (!rsaKeyPair) {
      rsaKeyPair = await crypto.subtle.generateKey(
        {
          name: "RSA-OAEP",
          modulusLength: 2048,
          publicExponent: new Uint8Array([0x01, 0x00, 0x01]), // 65537
          hash: "SHA-256"
        },
        true,
        ["encrypt", "decrypt"]
      );
    }
    return rsaKeyPair;
  }

  async function rsaEncrypt(plaintext) {
    const kp = await getRsaKeyPair();

    // 1. random session key
    const aesKey = await crypto.subtle.generateKey(
      { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
    );
    const rawAesKey = await crypto.subtle.exportKey("raw", aesKey);

    // 2. encrypt the message
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const dataBuf = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv }, aesKey, encoder.encode(plaintext)
    );

    // 3. wrap the AES key with RSA-OAEP
    const wrappedBuf = await crypto.subtle.encrypt(
      { name: "RSA-OAEP" }, kp.publicKey, rawAesKey
    );

    return [
      "RSAOAEP",
      bytesToBase64(new Uint8Array(wrappedBuf)),
      bytesToBase64(iv),
      bytesToBase64(new Uint8Array(dataBuf))
    ].join(":");
  }

  async function rsaDecrypt(ciphertext) {
    const parts = ciphertext.trim().split(":");
    if (parts.length !== 4 || parts[0] !== "RSAOAEP") {
      throw new Error(
        'Invalid RSA ciphertext. Expected format "RSAOAEP:wrappedKey:iv:data".'
      );
    }
    if (!rsaKeyPair) {
      throw new Error(
        "No RSA private key in memory. RSA decryption only works in the same " +
        "browser session that created the key pair (reload the page and it is lost)."
      );
    }

    const wrapped = base64ToBytes(parts[1]);
    const iv      = base64ToBytes(parts[2]);
    const data    = base64ToBytes(parts[3]);

    try {
      const rawAesKey = await crypto.subtle.decrypt(
        { name: "RSA-OAEP" }, rsaKeyPair.privateKey, wrapped
      );
      const aesKey = await crypto.subtle.importKey(
        "raw", rawAesKey, { name: "AES-GCM" }, false, ["decrypt"]
      );
      const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, aesKey, data);
      return decoder.decode(plainBuf);
    } catch {
      throw new Error("RSA decryption failed — the ciphertext or key is invalid.");
    }
  }

  /* ======================================================================
     5) SHA-256  (cryptographic hash — ONE-WAY, cannot be decrypted)
     ----------------------------------------------------------------------
     Produces a fixed 256-bit (64 hex character) digest. Any change to the
     input produces a completely different, unpredictable digest.
     ====================================================================== */
  async function sha256(text) {
    const digestBuf = await crypto.subtle.digest("SHA-256", encoder.encode(text));
    return Array.from(new Uint8Array(digestBuf))
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
  }

  /* ============================ UI logic ============================== */

  function updateKeyField() {
    const algo = els.algo.value;
    els.keyInput.value = "";

    if (algo === "caesar") {
      els.keyRow.hidden = false;
      els.keyLabel.textContent = "Shift value";
      els.keyInput.type = "number";
      els.keyInput.placeholder = "3";
      els.keyHint.textContent = "A whole number (positive or negative). Defaults to 3 if left empty.";
    } else if (algo === "aes") {
      els.keyRow.hidden = false;
      els.keyLabel.textContent = "Password / passphrase";
      els.keyInput.type = "password";
      els.keyInput.placeholder = "Minimum 4 characters";
      els.keyHint.textContent = "Used with PBKDF2 (150 000 iterations) to derive the 256-bit AES key. You must remember it — it is never stored.";
    } else {
      els.keyRow.hidden = true;
      els.keyInput.type = "text";
      els.keyInput.placeholder = "";
      els.keyHint.textContent = "";
    }
  }

  /** Common validation for both Encrypt and Decrypt. */
  function validate() {
    const text = els.input.value;
    const algo = els.algo.value;

    if (!text.trim()) {
      setStatus("Please enter some text before continuing.", "error");
      els.input.focus();
      return null;
    }
    if (!algo) {
      setStatus("Please select an encryption method from the dropdown.", "error");
      els.algo.focus();
      return null;
    }
    return { text, algo };
  }

  function getShift() {
    const raw = els.keyInput.value.trim();
    if (raw === "") return 3;
    const n = Number(raw);
    if (!Number.isInteger(n)) {
      throw new Error("The Caesar shift must be a whole number (e.g. 3 or -5).");
    }
    return n;
  }

  function getPassword() {
    const pwd = els.keyInput.value;
    if (pwd.length < 4) {
      throw new Error("Please enter a password with at least 4 characters.");
    }
    return pwd;
  }

  /* ----------------------------- Encrypt ------------------------------ */
  async function handleEncrypt() {
    const valid = validate();
    if (!valid) return;
    const { text, algo } = valid;

    setBusy(true);
    try {
      let result;

      switch (algo) {
        case "caesar":
          result = caesarCipher(text, getShift());
          break;

        case "base64":
          result = base64Encode(text);
          break;

        case "aes":
          result = await aesEncrypt(text, getPassword());
          break;

        case "rsa":
          setStatus("Generating a 2048-bit RSA key pair (first run only)…", "info");
          result = await rsaEncrypt(text);
          break;

        case "sha256":
          result = await sha256(text);
          break;

        default:
          throw new Error("Unsupported algorithm.");
      }

      els.output.value = result;

      if (algo === "sha256") {
        setStatus("SHA-256 hash generated. Note: hashing is one-way and cannot be reversed.", "warn");
      } else if (algo === "rsa") {
        setStatus("Encryption successful. RSA private key is held in memory for this session only.", "success");
      } else {
        setStatus("Encryption successful.", "success");
      }
    } catch (err) {
      setStatus(err.message || "An unexpected error occurred.", "error");
    } finally {
      setBusy(false);
    }
  }

  /* ----------------------------- Decrypt ------------------------------ */
  async function handleDecrypt() {
    const valid = validate();
    if (!valid) return;
    const { text, algo } = valid;

    setBusy(true);
    try {
      let result;

      switch (algo) {
        case "caesar":
          result = caesarCipher(text, -getShift());
          break;

        case "base64":
          result = base64Decode(text);
          break;

        case "aes":
          result = await aesDecrypt(text, getPassword());
          break;

        case "rsa":
          result = await rsaDecrypt(text);
          break;

        case "sha256":
          throw new Error("SHA-256 is a one-way hash function — it cannot be decrypted.");

        default:
          throw new Error("Unsupported algorithm.");
      }

      els.output.value = result;
      setStatus("Decryption successful.", "success");
    } catch (err) {
      setStatus(err.message || "An unexpected error occurred.", "error");
    } finally {
      setBusy(false);
    }
  }

  /* ------------------------------- Copy ------------------------------- */
  async function handleCopy() {
    const value = els.output.value;
    if (!value) {
      setStatus("There is nothing to copy yet.", "error");
      return;
    }
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
      } else {
        // Fallback for non-secure contexts
        els.output.removeAttribute("readonly");
        els.output.select();
        document.execCommand("copy");
        els.output.setAttribute("readonly", "");
        window.getSelection().removeAllRanges();
      }
      setStatus("Ciphertext copied to clipboard.", "success");
    } catch {
      setStatus("Copy failed — please select the text and copy it manually.", "error");
    }
  }

  /* ------------------------------- Clear ------------------------------ */
  function handleClear() {
    els.input.value = "";
    els.output.value = "";
    els.keyInput.value = "";
    els.algo.value = "";
    updateKeyField();
    setStatus("Cleared. Ready for new input.");
    els.input.focus();
  }

  /* --------------------------- Event wiring --------------------------- */
  els.algo.addEventListener("change", updateKeyField);
  els.encryptBtn.addEventListener("click", handleEncrypt);
  els.decryptBtn.addEventListener("click", handleDecrypt);
  els.copyBtn.addEventListener("click", handleCopy);
  els.clearBtn.addEventListener("click", handleClear);

  // Ctrl/Cmd + Enter = Encrypt
  els.input.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      handleEncrypt();
    }
  });

  updateKeyField();
  setStatus("Ready. Enter text, choose a method, and press Encrypt.");
})();
</script>
</body>
</html>
